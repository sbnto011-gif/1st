<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>자식들도 배꼽 잡는 최신 아재개그 퀴즈</title>
    
    <!-- 카카오톡 및 SNS 공유를 위한 Open Graph 메타 태그 -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="🤣 자식들도 배꼽 잡는 최신 아재개그 퀴즈">
    <meta property="og:description" content="당신의 아재력 테스트! 총 9문제 중 몇 개나 맞힐 수 있을까요? 지금 바로 도전해보세요!">
    <meta property="og:image" content="https://placehold.co/800x400/4338ca/ffffff?text=%EC%B5%9C%EC%8B%A0+%EC%95%84%EC%9E%AC%EA%B0%9C%EA%B7%B8+%ED%80%B4%EC%A6%88">

    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter 및 Noto Sans KR -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans KR', 'Inter', sans-serif;
            /* 모바일 뷰포트 높이 대응 (가상 키보드 올라올 때 깨짐 방지) */
            min-height: 100dvh;
            background: linear-gradient(135deg, #3b4252 0%, #2e3440 100%);
            -webkit-tap-highlight-color: transparent;
        }

        /* 정답 축하 바운스 애니메이션 */
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            70% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 오답 흔들림 애니메이션 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .animate-pop {
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        /* 스크롤바 숨김 처리 */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="text-slate-800 flex flex-col items-center justify-between p-4 sm:p-6 select-none">

    <!-- 상단 헤더 영역 (타이틀, 리셋 버튼, 공유 버튼) -->
    <header class="w-full max-w-md flex items-center justify-between gap-2 pt-1 pb-3">
        <div class="flex items-center gap-2">
            <span class="text-2xl" role="img" aria-label="웃음">🤣</span>
            <h1 class="text-white font-extrabold text-base sm:text-lg tracking-tight leading-tight">
                최신 아재개그 퀴즈
            </h1>
        </div>
        
        <div class="flex items-center gap-1.5">
            <!-- 링크 복사/공유 버튼 -->
            <button id="shareBtn" type="button" onclick="shareQuiz()" 
                class="bg-amber-400 hover:bg-amber-300 active:scale-95 text-slate-900 font-bold text-xs sm:text-sm px-3 py-2 rounded-xl shadow-md transition-all flex items-center gap-1"
                title="카카오톡 등으로 링크 공유하기">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path>
                </svg>
                <span>공유</span>
            </button>

            <!-- 리셋(초기화) 버튼 -->
            <button id="headerResetBtn" type="button" onclick="resetQuiz()" 
                class="bg-slate-700/80 hover:bg-slate-600 active:scale-95 text-slate-100 font-semibold text-xs sm:text-sm px-3 py-2 rounded-xl border border-slate-600 shadow-md transition-all flex items-center gap-1"
                title="처음부터 다시 시작">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                <span>리셋</span>
            </button>
        </div>
    </header>

    <!-- 메인 컨텐츠 카드 영역 -->
    <main class="w-full max-w-md my-auto flex flex-col justify-center">
        
        <!-- 퀴즈 진행 화면 -->
        <div id="quizCard" class="bg-white rounded-3xl shadow-2xl p-6 sm:p-8 border border-slate-100 transition-all">
            
            <!-- 상단 상태 표시줄: 진행도 & 현재 점수 -->
            <div class="flex items-center justify-between mb-3">
                <span id="progressBadge" class="bg-indigo-100 text-indigo-700 font-extrabold text-xs sm:text-sm px-3 py-1 rounded-full">
                    1 / 9 문제
                </span>
                <div class="flex items-center gap-1.5 bg-slate-100 px-3 py-1 rounded-full">
                    <span class="text-xs text-slate-500 font-semibold">현재 점수</span>
                    <span id="scoreDisplay" class="text-indigo-600 font-black text-sm">0점</span>
                </div>
            </div>

            <!-- 진행률 프로그레스 바 -->
            <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden mb-6">
                <div id="progressBar" class="bg-indigo-600 h-full transition-all duration-300 rounded-full" style="width: 11.1%"></div>
            </div>

            <!-- 문제 출력 영역 -->
            <div class="mb-6">
                <span class="inline-block text-indigo-500 font-black text-lg mb-1">Q.</span>
                <h2 id="questionText" class="text-xl sm:text-2xl font-extrabold text-slate-800 leading-snug break-keep">
                    문제를 불러오는 중입니다...
                </h2>
            </div>

            <!-- 정답 입력 폼 (키보드 입력 및 엔터 처리) -->
            <div class="space-y-3">
                <div class="relative">
                    <input type="text" id="answerInput" 
                        placeholder="정답을 입력하세요" 
                        autocomplete="off" 
                        autocorrect="off" 
                        autocapitalize="off" 
                        spellcheck="false"
                        class="w-full px-4 py-3.5 text-base sm:text-lg font-bold text-slate-800 bg-slate-50 border-2 border-slate-200 rounded-2xl focus:outline-none focus:border-indigo-500 focus:bg-white transition-colors placeholder:text-slate-400 placeholder:font-normal">
                </div>

                <!-- 정오 판별 피드백 박스 (확인 버튼 클릭 후 노출) -->
                <div id="feedbackBox" class="hidden rounded-2xl p-4 text-center transition-all">
                    <div id="feedbackTitle" class="font-black text-lg sm:text-xl mb-1"></div>
                    <p id="feedbackDetail" class="text-sm font-semibold"></p>
                </div>

                <!-- 액션 버튼 (확인 버튼 / 다음 문제 버튼) -->
                <button id="submitBtn" type="button" onclick="handleAction()" 
                    class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-extrabold text-base sm:text-lg py-3.5 rounded-2xl shadow-lg shadow-indigo-200 transition-all">
                    확인
                </button>
            </div>
        </div>

        <!-- 최종 결과 화면 (9문제 완료 시 노출) -->
        <div id="resultCard" class="hidden bg-white rounded-3xl shadow-2xl p-6 sm:p-8 border border-slate-100 text-center animate-pop">
            <div id="resultEmoji" class="text-6xl mb-3">🏆</div>
            <h2 class="text-2xl sm:text-3xl font-black text-slate-800 mb-2">퀴즈 완료!</h2>
            
            <div class="bg-indigo-50 rounded-2xl p-5 my-5 border border-indigo-100">
                <p class="text-sm text-indigo-600 font-bold mb-1">최종 성적</p>
                <p id="finalScoreText" class="text-3xl sm:text-4xl font-black text-indigo-700 mb-2">
                    9문제 중 0문제 정답!
                </p>
                <p id="resultComment" class="text-sm sm:text-base text-slate-600 font-semibold break-keep">
                    멘트 로딩 중...
                </p>
            </div>

            <!-- 오답 노트 / 전체 정답 요약 토글 또는 리스트 -->
            <div class="text-left mb-6">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 px-1">이번 라운드 풀이 결과</h3>
                <ul id="summaryList" class="space-y-2 max-h-48 overflow-y-auto pr-1 text-sm">
                    <!-- 자바스크립트로 풀이 내역 동적 생성 -->
                </ul>
            </div>

            <div class="flex flex-col sm:flex-row gap-2.5">
                <button type="button" onclick="resetQuiz()" 
                    class="flex-1 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-extrabold text-base py-3.5 rounded-2xl shadow-lg shadow-indigo-200 transition-all">
                    🔄 다시 풀기 (리셋)
                </button>
                <button type="button" onclick="shareQuiz()" 
                    class="flex-1 bg-amber-400 hover:bg-amber-300 active:scale-[0.98] text-slate-900 font-extrabold text-base py-3.5 rounded-2xl shadow-md transition-all">
                    💬 카톡으로 공유하기
                </button>
            </div>
        </div>

    </main>

    <!-- 하단 안내 문구 -->
    <footer class="w-full max-w-md text-center pt-3 pb-1">
        <p class="text-slate-400 text-xs">
            자식들도 배꼽 잡는 최신 아재개그 퀴즈 · 엔터(Enter)키로 빠른 진행 가능
        </p>
    </footer>

    <!-- 토스트 알림 메시지 (alert 대체용) -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900/95 text-white text-sm font-bold px-5 py-3 rounded-full shadow-xl opacity-0 pointer-events-none transition-opacity duration-300 z-50 whitespace-nowrap">
        알림 메시지
    </div>

    <script>
        /**
         * 원본 아재개그 퀴즈 데이터 (총 9문제)
         * 유연한 채점을 위해 acceptedAnswers 배열에 허용 정답을 모두 등록
         */
        const ORIGINAL_QUIZ_DATA = [
            {
                id: 1,
                question: "치과의사가 싫어하는 아파트는?",
                answer: "이편한세상",
                acceptedAnswers: ["이편한세상", "e편한세상"]
            },
            {
                id: 2,
                question: "수박 1통엔 5천원 그럼 두통엔?",
                answer: "게보린",
                acceptedAnswers: ["게보린", "타이레놀", "펜잘"] // 이미지 정답은 게보린이며 대표 정답으로 표시
            },
            {
                id: 3,
                question: "다리미가 좋아하는 음식은?",
                answer: "피자",
                acceptedAnswers: ["피자"]
            },
            {
                id: 4,
                question: "소금이 감옥에 들어가면?",
                answer: "소금방",
                acceptedAnswers: ["소금방"]
            },
            {
                id: 5,
                question: "스님이 입원한 방은?",
                answer: "중환자실",
                acceptedAnswers: ["중환자실"]
            },
            {
                id: 6,
                question: "소나타는 누가 탈까?",
                answer: "소",
                acceptedAnswers: ["소"]
            },
            {
                id: 7,
                question: "형을 너무 좋아하는 동생은?",
                answer: "형광펜",
                acceptedAnswers: ["형광펜", "형광팬"]
            },
            {
                id: 8,
                question: "왕이 헤어질 때 하는 인사는?",
                answer: "바이킹",
                acceptedAnswers: ["바이킹"]
            },
            {
                id: 9,
                question: "세상에서 가장 가난한 왕은?",
                answer: "최저임금",
                acceptedAnswers: ["최저임금"]
            }
        ];

        // 앱 상태 변수
        let shuffledQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let isAnswered = false; // 현재 문제의 정답 확인 완료 여부
        let userHistory = [];   // 결과 화면 요약을 위한 풀이 기록

        // DOM 요소 캐싱
        const quizCard = document.getElementById('quizCard');
        const resultCard = document.getElementById('resultCard');
        const progressBadge = document.getElementById('progressBadge');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const progressBar = document.getElementById('progressBar');
        const questionText = document.getElementById('questionText');
        const answerInput = document.getElementById('answerInput');
        const feedbackBox = document.getElementById('feedbackBox');
        const feedbackTitle = document.getElementById('feedbackTitle');
        const feedbackDetail = document.getElementById('feedbackDetail');
        const submitBtn = document.getElementById('submitBtn');
        const toastEl = document.getElementById('toast');

        /**
         * Fisher-Yates 셔플 알고리즘
         * 배열을 무작위 순서로 완벽하게 섞어 반환
         */
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        /**
         * 문자열 정규화 함수 (공백 제거 및 소문자 변환)
         */
        function normalizeText(str) {
            return str.replace(/\s+/g, '').toLowerCase().trim();
        }

        /**
         * 토스트 알림 표시 함수 (alert() 대체)
         */
        let toastTimeout;
        function showToast(message) {
            toastEl.textContent = message;
            toastEl.classList.remove('opacity-0');
            toastEl.classList.add('opacity-100');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toastEl.classList.remove('opacity-100');
                toastEl.classList.add('opacity-0');
            }, 2200);
        }

        /**
         * 퀴즈 초기화 및 리셋
         */
        function resetQuiz() {
            shuffledQuestions = shuffleArray(ORIGINAL_QUIZ_DATA);
            currentIndex = 0;
            score = 0;
            isAnswered = false;
            userHistory = [];

            // 화면 전환
            resultCard.classList.add('hidden');
            quizCard.classList.remove('hidden');

            renderQuestion();
            showToast("문제가 랜덤으로 새롭게 섞였습니다! 🔄");
        }

        /**
         * 현재 문제 렌더링
         */
        function renderQuestion() {
            const total = shuffledQuestions.length;
            const currentQ = shuffledQuestions[currentIndex];

            isAnswered = false;

            // 상단 진행도 & 점수 업데이트
            progressBadge.textContent = `${currentIndex + 1} / ${total} 문제`;
            scoreDisplay.textContent = `${score}점`;
            progressBar.style.width = `${((currentIndex + 1) / total) * 100}%`;

            // 문제 텍스트 설정
            questionText.textContent = currentQ.question;

            // 입력창 초기화 및 활성화
            answerInput.value = '';
            answerInput.disabled = false;
            answerInput.classList.remove('border-emerald-500', 'bg-emerald-50', 'border-rose-500', 'bg-rose-50');
            
            // 피드백 영역 숨김
            feedbackBox.classList.add('hidden');
            feedbackBox.classList.remove('animate-pop', 'animate-shake');

            // 버튼 상태 '확인'으로 변경
            submitBtn.textContent = '확인';
            submitBtn.className = 'w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-extrabold text-base sm:text-lg py-3.5 rounded-2xl shadow-lg shadow-indigo-200 transition-all';

            // 입력창 포커스 (모바일 환경 고려하여 약간의 지연 후 포커스)
            setTimeout(() => {
                answerInput.focus();
            }, 50);
        }

        /**
         * '확인' 또는 '다음 문제' 버튼 클릭 통합 핸들러
         */
        function handleAction() {
            if (!isAnswered) {
                checkAnswer();
            } else {
                nextQuestion();
            }
        }

        /**
         * 정답 판별 및 정오(O / X) 표시
         */
        function checkAnswer() {
            const rawInput = answerInput.value;
            const normalizedInput = normalizeText(rawInput);

            // 빈 값 입력 방지
            if (!normalizedInput) {
                showToast("정답을 입력해주세요! ✍️");
                answerInput.focus();
                quizCard.classList.remove('animate-shake');
                void quizCard.offsetWidth; // 리플로우 트리거
                quizCard.classList.add('animate-shake');
                return;
            }

            const currentQ = shuffledQuestions[currentIndex];
            // 허용 정답 리스트와 비교 (2번 문제의 경우 이미지 기준 '게보린'을 기본으로 하되 정확히 일치 체크)
            const validAnswers = currentQ.id === 2 
                ? ["게보린"] 
                : currentQ.acceptedAnswers.map(ans => normalizeText(ans));

            const isCorrect = validAnswers.includes(normalizedInput);

            isAnswered = true;
            answerInput.disabled = true;

            // 기록 저장
            userHistory.push({
                question: currentQ.question,
                userAnswer: rawInput.trim(),
                correctAnswer: currentQ.answer,
                isCorrect: isCorrect
            });

            // 피드백 UI 업데이트
            feedbackBox.classList.remove('hidden');

            if (isCorrect) {
                score++;
                scoreDisplay.textContent = `${score}점`;

                answerInput.classList.add('border-emerald-500', 'bg-emerald-50');
                feedbackBox.className = 'rounded-2xl p-4 text-center bg-emerald-50 border border-emerald-200 text-emerald-800 animate-pop';
                feedbackTitle.innerHTML = '정답입니다! ⭕';
                feedbackDetail.textContent = `센스 만점! 정답은 '${currentQ.answer}'입니다.`;
            } else {
                answerInput.classList.add('border-rose-500', 'bg-rose-50');
                feedbackBox.className = 'rounded-2xl p-4 text-center bg-rose-50 border border-rose-200 text-rose-800 animate-shake';
                feedbackTitle.innerHTML = '오답입니다! ❌';
                feedbackDetail.innerHTML = `아쉽네요! 실제 정답은 <span class="underline font-black text-rose-600">'${currentQ.answer}'</span>입니다.`;
            }

            // 버튼 텍스트를 '다음 문제' 또는 '결과 보기'로 전환
            const isLast = currentIndex === shuffledQuestions.length - 1;
            submitBtn.textContent = isLast ? '최종 결과 보기 🎉' : '다음 문제 👉';
            submitBtn.className = 'w-full bg-slate-800 hover:bg-slate-900 active:scale-[0.98] text-white font-extrabold text-base sm:text-lg py-3.5 rounded-2xl shadow-lg transition-all';
        }

        /**
         * 다음 문제로 이동 또는 결과 화면 출력
         */
        function nextQuestion() {
            if (currentIndex < shuffledQuestions.length - 1) {
                currentIndex++;
                renderQuestion();
            } else {
                showResultScreen();
            }
        }

        /**
         * 최종 결과 화면 표시
         */
        function showResultScreen() {
            quizCard.classList.add('hidden');
            resultCard.classList.remove('hidden');

            const total = shuffledQuestions.length;
            document.getElementById('finalScoreText').textContent = `${total}문제 중 ${score}문제 정답!`;

            // 점수대별 재치 있는 멘트 및 이모지 설정
            const resultEmoji = document.getElementById('resultEmoji');
            const resultComment = document.getElementById('resultComment');

            if (score === total) {
                resultEmoji.textContent = '👑';
                resultComment.textContent = '완벽합니다! 당신은 명실상부 대한민국 최고의 아재개그 마스터!';
            } else if (score >= 7) {
                resultEmoji.textContent = '🤣';
                resultComment.textContent = '대단해요! 자식들도 배꼽 잡고 쓰러질 유머 감각의 소유자시네요!';
            } else if (score >= 4) {
                resultEmoji.textContent = '😎';
                resultComment.textContent = '준수한 아재력입니다! 조금만 더 연마하면 부장님 소리 들을 수 있어요!';
            } else {
                resultEmoji.textContent = '🐣';
                resultComment.textContent = '아직 순수한 감성을 가지고 계시군요! 다시 풀기로 아재력을 키워보세요!';
            }

            // 풀이 요약 리스트 렌더링
            const summaryList = document.getElementById('summaryList');
            summaryList.innerHTML = userHistory.map((item, idx) => `
                <li class="p-3 rounded-xl border ${item.isCorrect ? 'bg-emerald-50/60 border-emerald-100' : 'bg-rose-50/60 border-rose-100'} flex items-start justify-between gap-2">
                    <div class="break-keep">
                        <span class="font-bold text-slate-700">${idx + 1}. ${item.question}</span>
                        <div class="text-xs mt-1 text-slate-500">
                            내 답: <span class="font-semibold ${item.isCorrect ? 'text-emerald-600' : 'text-rose-500'}">${item.userAnswer}</span>
                            ${!item.isCorrect ? ` / 정답: <span class="font-bold text-slate-700">${item.correctAnswer}</span>` : ''}
                        </div>
                    </div>
                    <span class="text-base shrink-0">${item.isCorrect ? '⭕' : '❌'}</span>
                </li>
            `).join('');
        }

        /**
         * 링크 공유 및 클립보드 복사 기능 (카카오톡 모바일 공유 지원 + 폴백 복사)
         */
        function shareQuiz() {
            const shareUrl = window.location.href;
            const shareData = {
                title: '🤣 자식들도 배꼽 잡는 최신 아재개그 퀴즈',
                text: '당신의 아재력 테스트! 9문제 중 몇 개나 맞힐 수 있을까요?',
                url: shareUrl
            };

            // 모바일 브라우저 Web Share API 지원 시 우선 호출
            if (navigator.share && /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
                navigator.share(shareData).catch(() => {
                    copyToClipboard(shareUrl);
                });
            } else {
                copyToClipboard(shareUrl);
            }
        }

        /**
         * iFrame 및 인앱 브라우저 호환 클립보드 복사
         */
        function copyToClipboard(text) {
            const tempInput = document.createElement('input');
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            tempInput.setSelectionRange(0, 99999);
            
            try {
                document.execCommand('copy');
                showToast('링크가 복사되었습니다! 카톡창에 붙여넣기 하세요 📋');
            } catch (err) {
                showToast('링크 복사에 실패했습니다.');
            }
            
            document.body.removeChild(tempInput);
        }

        /**
         * 키보드 엔터(Enter) 키 이벤트 리스너
         * 입력창 포커스 중이거나 정답 확인 후 다음 문제로 넘어갈 때 모두 동작
         */
        document.addEventListener('keydown', function(event) {
            // 한글 입력 조합 중(IME) 중복 실행 방지
            if (event.isComposing) return;

            if (event.key === 'Enter') {
                // 결과 화면이 떠 있을 때는 무시
                if (!resultCard.classList.contains('hidden')) return;

                event.preventDefault();
                handleAction();
            }
        });

        // 페이지 로드 시 최초 실행
        window.onload = function() {
            shuffledQuestions = shuffleArray(ORIGINAL_QUIZ_DATA);
            renderQuestion();
        };
    </script>
</body>
</html>
